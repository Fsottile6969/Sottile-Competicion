<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller Sottile-Competicion - Acceso</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="/" style="text-decoration:none">
          <h1>🔧 Sottile-<span>Competicion</span></h1>
        </a>
        <p>+15 años de experiencia a tu servicio</p>
      </div>

      <div id="alertBox"></div>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">Iniciar sesión</button>
        <button class="auth-tab" onclick="switchTab('register')">Registrarse</button>
      </div>

      <!-- LOGIN -->
      <div id="loginForm">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••">
        </div>
        <button class="btn btn-primary btn-block" onclick="login()">
          <span id="loginBtnText">Ingresar</span>
        </button>

        <div class="divider">o continuá con</div>

        <button class="btn btn-google" onclick="loginGoogle()">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
          Continuar con Google
        </button>
      </div>

      <!-- REGISTER -->
      <div id="registerForm" style="display:none">
        <div class="form-group">
          <label class="form-label">Nombre completo *</label>
          <input type="text" id="regNombre" class="form-control" placeholder="Juan Pérez">
        </div>
        <div class="form-group">
          <label class="form-label">Teléfono *</label>
          <input type="tel" id="regTelefono" class="form-control" placeholder="+54 9 11 1234-5678">
          <small style="color:#6c757d;font-size:0.78rem">Lo usamos para contactarte sobre tu turno</small>
        </div>
        <div class="form-group">
          <label class="form-label">Email *</label>
          <input type="email" id="regEmail" class="form-control" placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña *</label>
          <input type="password" id="regPassword" class="form-control" placeholder="Mínimo 6 caracteres">
        </div>
        <button class="btn btn-primary btn-block" onclick="register()">Crear cuenta</button>

        <div class="divider">o continuá con</div>

        <button class="btn btn-google" onclick="loginGoogle()">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
          Continuar con Google
        </button>
      </div>

      <!-- COMPLETAR TELEFONO (Google sin teléfono) -->
      <div id="telefonoForm" style="display:none">
        <div class="alert alert-success" style="margin-bottom:1rem">✅ ¡Cuenta de Google verificada! Solo falta tu teléfono.</div>
        <div class="form-group">
          <label class="form-label">Teléfono *</label>
          <input type="tel" id="googleTelefono" class="form-control" placeholder="+54 9 11 1234-5678">
          <small style="color:#6c757d;font-size:0.78rem">Lo usamos para contactarte sobre tu turno</small>
        </div>
        <button class="btn btn-primary btn-block" onclick="guardarTelefonoGoogle()">Continuar</button>
      </div>
    </div>
  </div>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    const API = '/api';

    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (tab === 'login')));
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
      clearAlert();
    }

    function showAlert(msg, type = 'error') {
      document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    }
    function clearAlert() { document.getElementById('alertBox').innerHTML = ''; }

    function saveSession(data) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = data.user.rol === 'admin' ? '/admin' : '/cliente';
    }

    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) return showAlert('Completá todos los campos');

      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) return showAlert(data.error);
      saveSession(data);
    }

    let pendingGoogleData = null;

    async function register() {
      const nombre = document.getElementById('regNombre').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const telefono = document.getElementById('regTelefono').value.trim();
      if (!nombre || !email || !password) return showAlert('Completá los campos obligatorios');
      if (!telefono) return showAlert('El teléfono es obligatorio para poder contactarte');
      if (password.length < 6) return showAlert('La contraseña debe tener al menos 6 caracteres');

      const res = await fetch(`${API}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, email, password, telefono })
      });
      const data = await res.json();
      if (!res.ok) return showAlert(data.error);
      saveSession(data);
    }

    function loginGoogle() {
      fetch('/api/auth/config')
        .then(r => r.json())
        .then(({ googleClientId }) => {
          google.accounts.id.initialize({
            client_id: googleClientId,
        callback: async (response) => {
          const res = await fetch(`${API}/auth/google`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential: response.credential })
          });
          const data = await res.json();
          if (!res.ok) return showAlert(data.error);

          // Si el usuario no tiene teléfono, pedirlo antes de continuar
          if (data.sinTelefono) {
            pendingGoogleData = data;
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('telefonoForm').style.display = 'block';
            document.querySelectorAll('.auth-tab').forEach(t => t.style.display = 'none');
            return;
          }
          saveSession(data);
        }
      });
      google.accounts.id.prompt();
        })
        .catch(() => showAlert('Error al conectar con Google. Intentá nuevamente.'));
    }

    async function guardarTelefonoGoogle() {
      const telefono = document.getElementById('googleTelefono').value.trim();
      if (!telefono) return showAlert('El teléfono es obligatorio');

      const res = await fetch(`${API}/auth/update-telefono`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${pendingGoogleData.token}` },
        body: JSON.stringify({ telefono })
      });
      if (!res.ok) return showAlert('Error al guardar el teléfono');
      saveSession(pendingGoogleData);
    }

    // Redirigir si ya está logueado (solo clientes, no admin)
    if (localStorage.getItem('token')) {
      const u = JSON.parse(localStorage.getItem('user') || '{}');
      if (u.rol === 'admin') {
        // Admin ya logueado: mostrar opción de ir al panel o cerrar sesión
        document.getElementById('alertBox').innerHTML = `
          <div class="alert alert-success" style="text-align:center">
            Sesión activa como <strong>${u.nombre}</strong> (Admin)<br>
            <a href="/admin" class="btn btn-secondary btn-sm" style="margin-top:0.5rem;display:inline-flex">Ir al panel admin</a>
            <button onclick="localStorage.clear();location.reload()" class="btn btn-outline btn-sm" style="margin-top:0.5rem">Cerrar sesión</button>
          </div>`;
      } else {
        window.location.href = '/cliente';
      }
    }

    // Enter para login
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const isLogin = document.getElementById('loginForm').style.display !== 'none';
        isLogin ? login() : register();
      }
    });
  </script>
</body>
</html>
